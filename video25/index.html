<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>list styling CSS</title>
    <style>
        li{
            background-color: yellow;
            list-style: devanagari;
            list-style-position: inside;
            list-style-type: circle;
            list-style-type: "🔥";
            /* list-style-image: url("WhatsApp\ Image\ .my.jpg"); */
        }
    </style>
</head>
<body>
    <nav>
        <ul>
            <li>Home</li>
            <li>About</li>
            <li>Contact</li>
        </ul>
    </nav>
</body>
</html>
