<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadows</title>
        <style>
            .box{
                border: 2px solid black;
                padding: 30px;
                box-shadow: 10px 6px 5px green;
            }
            .textshadow{
                text-shadow: 5px 4px 2px #cf98cf;
    border: 2px solid yellow;
    border-radius: 10px;
    outline: 2px solid black;
    outline-offset: 7px;
}
            }
        </style>
</head>
<body>
    <div class="box">
        I am a box
    </div>
    <p class="textshadow">
        Lorem, ipsum dolor sit amet consectetur adipisicing elit. Excepturi officiis eligendi quam asperiores fugit eaque. Et, adipisci voluptates nesciunt, dicta sapiente hic nostrum quam esse quod reprehenderit aliquam molestias porro.
    </p>
</body>
</html>
