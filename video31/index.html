<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Media Queries</title>
    <style>
        body{
            background-color: rgb(198, 87, 87);
        }
        @media screen and (orientation: portrait){
            body{
                border: 2px solid purple;
                 /* background-color: rgb(198, 135, 53); */
            }
            .main{
                color: blue;
            }

        }
        @media screen and (max-width:500px) {
            body{
                /* border: 2px solid purple; */
                 background-color: rgb(198, 135, 53);              
            }
            .boxes{
                flex-direction: column;

            }
        }
        /* @media only mediatype and (expressions){
            css code;
        } */
         .boxes{
            display: flex;
        }
        .box{
            width: 344px;
            height: 344px;
            background-color: steelblue;
            padding: 3px;
            margin: 3px;
        }
    </style>
</head>
<body>
    <div class="main">
        Hey I am a red body guy!
    </div>
    <div class="boxes">
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
    </div>
</body>
</html>
